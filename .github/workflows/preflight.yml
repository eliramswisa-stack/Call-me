name: Safe SIP preflight (NO CALLS)
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/preflight.py"
      - "tools/call_gate.py"
      - "tools/audio_probe.py"
      - "tools/media_config.py"
      - "tests/test_preflight.py"
      - "tests/test_call_gate.py"
      - "tests/test_audio_probe.py"
      - "tests/test_media_config.py"
      - ".github/workflows/preflight.yml"
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Safe call gate dry run (never dials)
        run: python tools/call_gate.py --dry-run --owner-consent
      - name: Generate and inspect deterministic PCM WAV (no SIP call)
        run: python tools/audio_probe.py /tmp/call-me-reference.wav
      - name: Generate isolated headless audio configuration
        run: python tools/media_config.py /tmp/call-me-audio /tmp/call-me-reference.wav
      - name: SIP URI test
        run: python tools/preflight.py
      - name: SIP DNS and TLS check (never dials)
        run: python tools/preflight.py --network
