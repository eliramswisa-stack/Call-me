name: Validate Baresip modules (NO CALLS)
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/resolve_modules.py"
      - "tools/media_config.py"
      - "tools/audio_probe.py"
      - "tests/test_audio_probe.py"
      - "tests/test_resolve_modules.py"
      - ".github/workflows/module-diagnostics.yml"
permissions:
  contents: read
jobs:
  modules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install free Baresip package
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y baresip-core
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Inspect audio modules without dialing
        run: |
          set -eu
          python tools/audio_probe.py /tmp/probe.wav --seconds 6
          python tools/media_config.py /tmp/diagnostic-config /tmp/probe.wav
          dpkg-query -L baresip-core | grep -E '/(g711|aufile)\.so
          echo 'Module layout discovered. No calls have been attempted.'
 || true
          python tools/resolve_modules.py /tmp/diagnostic-config/config
          echo 'Module layout discovered. No calls have been attempted.'
