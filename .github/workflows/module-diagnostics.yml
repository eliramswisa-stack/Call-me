name: Validate Baresip modules (NO CALLS)
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/resolve_modules.py"
      - "tools/media_config.py"
      - "tools/audio_probe.py"
      - "tests/test_audio_probe.py"
      - "tests/test_resolve_modules.py"
      - ".github/workflows/module-diagnostics.yml"
permissions:
  contents: read
jobs:
  modules:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install free Baresip package
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y baresip baresip-core
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Inspect Baresip modules without dialing
        run: |
          set -euo pipefail
          python tools/audio_probe.py /tmp/probe.wav --seconds 6
          python tools/media_config.py /tmp/diagnostic-config /tmp/probe.wav
          python tools/resolve_modules.py /tmp/diagnostic-config/config
          # Offline startup smoke test: no accounts, no credentials, no dialing.
          touch /tmp/diagnostic-config/accounts
          set +e
          timeout 12s baresip -f /tmp/diagnostic-config -t 3 > /tmp/baresip-offline.log 2>&1
          status=$?
          set -e
          if grep -Eiq 'Populated 0 audio codecs|cannot open shared object file|module .*No such file|module .*not found' /tmp/baresip-offline.log; then
            echo "::error::Baresip failed its offline audio startup check."
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "::error::Baresip offline startup failed (exit code $status)."
            exit 1
          fi
          echo "Baresip offline startup passed. RTP media and real calls NOT verified."
